<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3341b">
<title>Préndete Mix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#140a0d);--ink:light-dark(#22090f,#fbece6);--muted:light-dark(#6e5359,#bea3aa);
--card:light-dark(#fff3ee,#20111a);--line:light-dark(#f0d6cc,#3b2029);--red:#e3341b;--redink:light-dark(#c42a12,#ff7a62);--yel:#ffc928;--ok:light-dark(#11743c,#5fd38d);
--dock:#1a0b10;--dockink:#fbece6;--dockmuted:#bea3aa;--pb:env(safe-area-inset-bottom,0px)}
@supports not (color:light-dark(#000,#fff)){:root{--bg:#fff;--ink:#22090f;--muted:#6e5359;--card:#fff3ee;--line:#f0d6cc;--redink:#c42a12;--ok:#11743c}
 @media (prefers-color-scheme:dark){:root{--bg:#140a0d;--ink:#fbece6;--muted:#bea3aa;--card:#20111a;--line:#3b2029;--redink:#ff7a62;--ok:#5fd38d}}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,-apple-system,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto}
.top{background:var(--red);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 14px}
.top .wrap{display:flex;align-items:center;gap:8px}
.top .ttl{flex:1 1 auto}
.top h1{font:400 clamp(30px,8vw,46px)/1.05 Anton,Impact,sans-serif;margin:0;overflow-wrap:anywhere}
.top .sub{margin:2px 0 0;font-weight:700;font-size:15px}
.top .rb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.2);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.top .rb svg{width:24px;height:24px;fill:currentColor}
main{padding:0 16px calc(120px + var(--pb))}
.sec{font:400 26px/1.1 Anton,Impact,sans-serif;margin:24px 0 6px}
.sub2{font-size:17px;font-weight:700;margin:18px 0 4px}
.lede{color:var(--muted);margin:0 0 6px;font-size:15px;max-width:62ch}
.small{font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);padding:18px 0;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font-weight:600;font-size:15px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:400;opacity:.8}
a.chip{color:inherit;text-decoration:none}
.chip .x{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:-6px}.chip .x svg{width:16px;height:16px;fill:currentColor}
.tabsbar{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.btn{font-weight:700;font-size:16px;min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn svg{width:20px;height:20px;fill:currentColor;flex:none}
.btn.red{background:var(--red);color:#fff}.btn.yel{background:var(--yel);color:#22090f}.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--redink);border:1px solid var(--redink)}
.btn.sm{min-height:38px;font-size:14.5px;padding:0 13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:18px 0 10px}
.card .sec{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:4px 0 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat b{display:block;font:400 26px/1.1 Anton,Impact,sans-serif}
.stat span{display:block;font-size:12.5px;line-height:1.25;color:var(--muted);font-weight:600;hyphens:manual}
.dirsum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status{font-size:15px;margin:8px 0 0;min-height:1.5em}
.job{display:flex;align-items:center;gap:12px;background:var(--yel);color:#22090f;border-radius:14px;padding:10px 12px;margin:12px 0}
.job p{margin:0;flex:1 1 auto;font-weight:600;font-size:15px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(34,9,15,.25);border-top-color:#22090f;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.note{border-left:4px solid var(--yel);padding:8px 12px;background:var(--card);border-radius:8px;margin:12px 0;font-size:15px}
.note.err{border-color:var(--redink)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row.sel{grid-template-columns:30px 52px minmax(0,1fr) auto}
.row .ckb{width:24px;height:24px;accent-color:var(--red)}
.cov{width:52px;height:52px;border-radius:8px;position:relative;overflow:hidden;border:0;padding:0;background:var(--card);display:block}
.cov img,.cov .ph,.big .ph,.big img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid!important;place-items:center;color:#fff;font:400 22px/1 Anton,Impact,sans-serif}
.cov .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,6,10,.38);opacity:0;transition:opacity .15s}
.cov .ov svg{width:22px;height:22px;fill:#fff}
@media (hover:hover){.cov:hover .ov{opacity:1}}
.cur .cov .ov{opacity:1}
.eq{display:none;gap:3px;align-items:flex-end;height:18px}
.eq i{display:block;width:3px;height:6px;background:#fff;border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:12px}}
.cur.playing .eq{display:flex}.cur.playing .pi{display:none}
.cur .t{color:var(--redink)}
.t{font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.m{color:var(--muted);font-size:14px;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.why{font-size:14px;line-height:1.35;margin-top:3px}
.fb{font-size:14px;line-height:1.35;margin-top:3px;color:var(--redink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.tag{font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--line)}
.tag.y{background:var(--yel);color:#22090f}.tag.r{background:var(--red);color:#fff}.tag.o{background:transparent;border:1px solid var(--line)}
.lnk{font-size:13.5px;font-weight:600;color:var(--ink);text-underline-offset:2px}
button.lnk{border:0;background:none;padding:0;text-decoration:underline}
.acts{display:flex;gap:2px;align-items:center}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;flex:none}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.ap{color:var(--ok)}.ib.rj{color:var(--redink)}
.ib:disabled{opacity:.35}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.tool select{min-height:40px;border:1px solid var(--line);border-radius:999px;padding:0 12px;background:var(--bg);font-size:15px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:40px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:18px;height:18px;fill:currentColor}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.45}
.batch{position:sticky;bottom:calc(76px + var(--pb));z-index:7;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.batch b{flex:1 1 auto}
.batch .btn{background:var(--bg);color:var(--ink)}.batch .btn.red{background:var(--red);color:#fff}.batch .btn.ok{background:var(--ok);color:#fff}
.field{display:grid;gap:6px;margin:14px 0}
.field>label,.field>.lbl{font-weight:700}
.field input[type=text],.field input[type=search],.field input[type=password],.field input[type=number],.field select,.field textarea{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);font-size:16px;width:100%}
.field textarea{padding:10px 12px;min-height:130px;line-height:1.45}
.field input[type=number]{max-width:120px}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--red);flex:none}
.opts{display:grid;gap:12px;margin:14px 0}
.optc{border:2px solid var(--line);border-radius:18px;background:var(--card);padding:16px;text-align:left;display:grid;gap:4px}
.optc b{font:400 22px/1.15 Anton,Impact,sans-serif}
.optc span{color:var(--muted)}
.optc[aria-pressed=true]{border-color:var(--red)}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin:14px 0}
.pl{border:0;background:transparent;padding:0;text-align:left;display:block;color:inherit;text-decoration:none}
.mos{aspect-ratio:1;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:var(--card);position:relative}
.mos.one{grid-template-columns:1fr}
.mos img,.mos .ph{width:100%;height:100%;object-fit:cover}
.mos .badge{position:absolute;left:6px;bottom:6px;background:var(--yel);color:#22090f;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}
.pl .nm{font-weight:700;margin-top:8px;line-height:1.25;overflow-wrap:anywhere}
.pl .ct{color:var(--muted);font-size:14px;line-height:1.35}
.big{width:min(78vw,320px);aspect-ratio:1;margin:8px auto 12px;border-radius:16px;overflow:hidden;background:var(--card);position:relative;border:0;padding:0;display:block}
.big .ov{position:absolute;right:10px;bottom:10px;width:58px;height:58px;border-radius:50%;background:var(--yel);display:grid;place-items:center}
.big .ov svg{width:32px;height:32px;fill:#22090f}
.rcard{text-align:center;padding:4px 0 8px}
.rcard .t{font-size:21px;-webkit-line-clamp:3}
.rcard .m{white-space:normal}
.rcard .tags{justify-content:center}
.rnav{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;font-weight:600}
.decide{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin:14px 0}
.res{border-bottom:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.res .cov{width:44px;height:44px}
.res .pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.res .pick .btn{min-height:34px;font-size:13.5px;padding:0 11px}
.ava{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--card)}
.ava img{width:100%;height:100%;object-fit:cover}
details.more{margin:14px 0;border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.more summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
#player{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--dock);color:var(--dockink);padding-bottom:var(--pb)}
#player .pbar{height:3px;background:rgba(255,255,255,.14)}#player .pbar i{display:block;height:100%;width:0;background:var(--yel)}
#player .in{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px 7px 12px}
#player .cov{width:44px;height:44px;border-radius:6px}
#player .open{border:0;background:transparent;text-align:left;padding:0;display:block;min-height:44px;color:inherit}
#player .t{font-size:15px;-webkit-line-clamp:1}#player .m{color:var(--dockmuted);font-size:13px}
#player .ib,.np .ib{color:var(--dockink)}#player .ib svg{width:26px;height:26px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--pb));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sheetwrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,3,6,.55)}
.sheet{position:relative;width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--pb))}
.sheet.tall{height:96vh;max-height:96vh}
.sheet h2{font:400 26px/1.1 Anton,Impact,sans-serif;margin:0 46px 6px 0}
.sheet .x{position:absolute;top:10px;right:10px}
.sheet .foot{position:sticky;bottom:calc(-18px - var(--pb));background:var(--bg);padding:10px 0 calc(4px + var(--pb));margin-top:10px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sheet .foot .btn{flex:1 1 auto}
.rgrp{margin:10px 0}
.rgrp .lbl{font-size:13.5px;font-weight:700;color:var(--muted);margin:0 0 4px}
.np{background:var(--dock);color:var(--dockink);text-align:center}
.np .m{color:var(--dockmuted);white-space:normal}
.npcov{width:min(72vw,300px);aspect-ratio:1;margin:18px auto 14px;border-radius:14px;overflow:hidden;background:#2c1820}
.npcov img,.npcov .ph{width:100%;height:100%;object-fit:cover;font-size:80px}
.np .t{font-size:21px;-webkit-line-clamp:3}
.seek{width:100%;margin:16px 0 4px;accent-color:var(--yel)}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--dockmuted)}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0}
.ctl .ib svg{width:32px;height:32px}
.ctl .bigp{width:66px;height:66px;background:var(--yel);color:#22090f!important}.ctl .bigp svg{width:36px;height:36px}
.np .lnk{color:var(--dockink)}
.auto{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;min-height:44px}
.auto input{width:20px;height:20px;accent-color:var(--yel)}
.prov{display:grid;gap:4px;border-bottom:1px solid var(--line);padding:12px 0}
.prov .nm{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (min-width:700px){.row{grid-template-columns:56px minmax(0,1fr) auto}.row.sel{grid-template-columns:30px 56px minmax(0,1fr) auto}.cov{width:56px;height:56px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <button class="rb" id="back" type="button" aria-label="Back to playlists" hidden></button>
 <div class="ttl"><h1 id="ttl">Préndete Mix</h1><p class="sub" id="sub"></p></div>
 <button class="rb" id="gear" type="button" aria-label="Settings"></button>
</div></header>
<div id="view"></div>

<div id="player" hidden>
 <div class="pbar"><i id="pfill"></i></div>
 <div class="wrap in">
  <div id="pcov"></div>
  <button class="open" id="popen" type="button" aria-label="Open player"><div class="t" id="pt"></div><div class="m" id="pm"></div></button>
  <div class="acts"><button class="ib" id="pplay" type="button" aria-label="Pause"></button><button class="ib" id="pnext" type="button" aria-label="Next song"></button></div>
 </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="sheets"></div>
<div class="sheetwrap" id="npw" hidden><div class="scrim" data-close></div>
 <div class="sheet np" role="dialog" aria-modal="true" aria-label="Now playing">
  <button class="ib x" type="button" data-close aria-label="Close player"></button>
  <div class="npcov" id="npcov"></div><div class="t" id="npt"></div><div class="m" id="npm"></div><div class="why" id="npwhy"></div>
  <input class="seek" id="seek" type="range" min="0" max="30" step="0.1" value="0" aria-label="Seek">
  <div class="times"><span id="tcur">0:00</span><span id="tdur">0:30</span></div>
  <div class="ctl"><button class="ib" id="nprev" type="button" aria-label="Previous song"></button><button class="ib bigp" id="nplay" type="button" aria-label="Play"></button><button class="ib" id="nnext" type="button" aria-label="Next song"></button></div>
  <p class="m" id="npctx"></p>
  <div class="btns" style="justify-content:center" id="npacts"></div>
  <label class="auto"><input type="checkbox" id="autonext"> Play the next sample automatically</label>
 </div>
</div>
<noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
<script src="core.js?v=3.0.0"></script>
<script src="catalog.js?v=3.0.0"></script>
<script src="engines.js?v=3.0.0"></script>
<script src="migrate.js?v=3.0.0"></script>
<script src="ui.js?v=3.0.0"></script>
<script src="views.js?v=3.0.0"></script>
<script src="main.js?v=3.0.0"></script>
</body>
</html>
